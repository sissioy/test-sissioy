title: Sissioy的个人博客
subtitle: 人间有味是清欢
description: Keep it simple and stupid.
keywords:
author: Sissioy
language: zh-CN
timezone: Asia/Shanghai

url: https://www.sissioy.top
root: /
permalink: posts/:year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: .build/modern
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

index_generator:
  path: ""
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10

meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include:
exclude:
ignore:

theme: next

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 0
  order_by: -date
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true
search:
  path: search.xml
  field: post
  content: true
  format: html

deploy:
